apiVersion: v1
kind: Service
metadata:
  name: helix
  namespace: helix
spec:
  selector:
    app: helix
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: helix-backend
  namespace: helix
spec:
  selector:
    app: helix
  ports:
    - name: http
      port: 8081
      targetPort: 8081
