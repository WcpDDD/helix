apiVersion: v1
kind: Service
metadata:
  name: helix-worker
  namespace: helix
spec:
  selector:
    app: helix-worker
  ports:
    - name: http
      port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-worker
  namespace: helix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: helix-worker
  template:
    metadata:
      labels:
        app: helix-worker
    spec:
      imagePullSecrets:
        - name: harbor-secret
      initContainers:
        - name: prepare
          image: harbor.oalite.com/devops/helix-worker:20261105-1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /var/helix/workers /var/helix/agentkit/worker"]
          volumeMounts:
            - name: data
              mountPath: /var/helix
      containers:
        - name: worker
          image: harbor.oalite.com/devops/helix-worker:20261105-1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: helix
            - secretRef:
                name: helix
          env:
            - name: HELIX_WORKER_BIND
              value: 0.0.0.0
            - name: HELIX_WORKER_ADDRESS
              value: http://helix-worker.helix.svc.cluster.local:8091
            - name: DOCKER_HOST
              value: tcp://docker.gitlab-runner:2375
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: NO_PROXY
              value: .oalite.com,.svc,.cluster.local,localhost,127.0.0.1,docker.gitlab-runner
            - name: KUBECONFIG
              value: /root/.kube/config
            - name: JAVA8_HOME
              value: /usr/lib/jvm/java-8-amazon-corretto
            - name: JAVA21_HOME
              value: /opt/jdk-21
            - name: JAVA_HOME
              value: /opt/jdk-21
          startupProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /var/helix
            - name: data
              mountPath: /root/.agentkit
              subPath: agentkit/worker
            - name: kube
              mountPath: /root/.kube/config
              subPath: config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: helix-data
        - name: kube
          secret:
            secretName: helix-kube
            defaultMode: 0600
