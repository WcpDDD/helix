apiVersion: v1
kind: ConfigMap
metadata:
  name: helix
  namespace: helix
data:
  AGENTKIT_MODEL: glm-5.3
  AGENTKIT_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
  AGENTKIT_VL_MODEL: ""
  HELIX_S3_ENDPOINT: https://cos.ap-shanghai.myqcloud.com
  HELIX_S3_REGION: ap-shanghai
  HELIX_S3_BUCKET: ags-sandbox-1309122329
  HELIX_S3_PREFIX: helix/home
  HELIX_FRONTEND_URL: https://helix.dev.oalite.com
  GITLAB_REDIRECT_URI: https://helix.dev.oalite.com/api/auth/callback
  GITLAB_SCOPE: api
  HELIX_WORK_ROOT: /var/helix/work
  HELIX_AGENTKIT_WORKSPACE: /var/helix/agents
  HELIX_SERVER: http://helix-backend.helix.svc.cluster.local:8081
  GITLAB_HOST: https://hackers.oalite.com
  GITLAB_PROJECT: qingflow-develop/qingflow-workspace
  HELIX_WORKER_ID: worker-k8s
  HELIX_WORKER_NAME: 集群
  HELIX_WORKER_PORT: "8091"
  HELIX_WORKER_ROOT: /var/helix/workers
  HTTP_PROXY: http://clash.gitlab-runner.svc.cluster.local:7897
  HTTPS_PROXY: http://clash.gitlab-runner.svc.cluster.local:7897
  NO_PROXY: .oalite.com,.svc,.cluster.local,localhost,127.0.0.1
  TZ: Asia/Shanghai
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
  JAVA_HOME: /opt/jdk-21
  JAVA8_HOME: /usr/lib/jvm/java-8-amazon-corretto
  JAVA21_HOME: /opt/jdk-21
  GLAB: /root/.helix/toolchain/bin/glab
  OPENSPEC: /usr/local/bin/openspec
  PNPM: /usr/local/bin/pnpm
  UV: /root/.helix/toolchain/bin/uv
  RG: /usr/local/bin/rg
  JQ: /usr/bin/jq
  MYSQL: /usr/bin/mysql
  GIT_AUTHOR_NAME: helix-worker
  GIT_AUTHOR_EMAIL: helix-worker@oalite.com
  GIT_COMMITTER_NAME: helix-worker
  GIT_COMMITTER_EMAIL: helix-worker@oalite.com
