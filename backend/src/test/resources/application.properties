spring.application.name=helix

spring.datasource.url=jdbc:sqlite:./target/helix-test.db
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

helix.frontend-url=http://localhost:5174
helix.gitlab.base-url=https://hackers.oalite.com
helix.gitlab.client-id=
helix.gitlab.client-secret=
helix.gitlab.redirect-uri=http://localhost:5174/api/auth/callback
helix.gitlab.scope=read_user
helix.align-interval=60s

helix.board-file=classpath:board/board.yaml
