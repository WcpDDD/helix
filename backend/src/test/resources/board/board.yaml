# 任务和 issue 的对应。这份文件在 workspace 里，是这份对应的来源。
#
# 一条任务恰好一张主 issue，任务编号就是这张 issue 的编号。
# children 只写子 issue，按编号升序。主 issue 不出现在 children 里，也不是边的端点。
# 没有写进任何 children 的 issue，自己就是一条任务。
# edges 只连接同一条任务里的子 issue。from 是前置，to 是后继。
# needs_contract 为 true 时要看一份规格。contract_ref 是相对仓库根的路径，还没有就省略这一键。
# needs_contract 为 false 时，这条边只表示实现顺序，不写 contract_ref。
