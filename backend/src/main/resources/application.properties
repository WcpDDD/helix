spring.application.name=helix
server.port=8080

spring.datasource.url=jdbc:sqlite:./helix.db
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

helix.frontend-url=${HELIX_FRONTEND_URL:http://localhost:5174}
helix.gitlab.base-url=https://hackers.oalite.com
helix.gitlab.client-id=${GITLAB_CLIENT_ID:}
helix.gitlab.client-secret=${GITLAB_CLIENT_SECRET:}
helix.gitlab.redirect-uri=${GITLAB_REDIRECT_URI:http://localhost:5174/api/auth/callback}
helix.gitlab.scope=${GITLAB_SCOPE:api}
helix.align-interval=60s

helix.agentkit.workspace=${HELIX_AGENTKIT_WORKSPACE:${user.home}/helix-agents}
helix.agentkit.model=${AGENTKIT_MODEL:}
helix.agentkit.base-url=${AGENTKIT_BASE_URL:https://api.openai.com/v1}
helix.agentkit.api-key=${AGENTKIT_API_KEY:}
helix.worker.lease=15s
helix.work-root=${HELIX_WORK_ROOT:${user.home}/helix-work}
helix.work-pull-times=09:00,13:00,18:00
helix.work-sync-parallel=2

spring.config.import=optional:file:./application-local.properties
