spring.application.name=helix
server.port=8080

spring.datasource.url=jdbc:sqlite:./helix.db
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

helix.frontend-url=${HELIX_FRONTEND_URL:http://localhost:5174}
helix.gitlab.base-url=https://hackers.oalite.com
helix.gitlab.client-id=${GITLAB_CLIENT_ID:}
helix.gitlab.client-secret=${GITLAB_CLIENT_SECRET:}
helix.gitlab.redirect-uri=${GITLAB_REDIRECT_URI:http://localhost:5174/api/auth/callback}
helix.gitlab.scope=${GITLAB_SCOPE:read_user}
helix.align-interval=60s

spring.config.import=optional:file:./application-local.properties
